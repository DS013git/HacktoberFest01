extract:
  ffmpeg_path: ffmpeg
  frame_interval_seconds: 2
  output_dir: outputs
dedupe:
  difference_threshold: 3.0
transcribe:
  model: base
  compute_type: int8
  device: cpu
  language: en
ocr:
  tesseract_cmd: "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"
align:
  window_seconds: 30
verify:
  fuzzy_threshold: 90
llm:
  base_url: "http://localhost:11434/v1"
  model: "gemma4:cloud"
  api_key_env: SCREEN2TUTORIAL_API_KEY
  api_key: "ollama"
  temperature: 0.2
  offline_mock: false
cache:
  enabled: true
